[project]
name = "open-wearables"
version = "0.9.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.2.0",
    "psycopg>=3.3.5",
    "sqlalchemy>=2.0.54",
    "fastapi>=0.139.2",
    "fastapi-cli>=0.0.32",
    "celery>=5.6.3",
    "flower>=2.1.0",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.69.1",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "httpx[http2]>=0.28.1",
    "alembic>=1.20.0",
    "boto3>=1.43.96",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "isodate>=0.7.2",
    "resend>=2.46.0",
    "pyyaml>=6.0.3",
    "svix>=2.5.0",
    "numpy>=2.5.3",
    "faker>=40.39.0",
    "fitdecode>=0.11.0",
    "google-auth>=2.58.0",
]

[dependency-groups]
code-quality = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "freezegun>=1.5.0",
    "factory-boy>=3.3.0",
    "psycopg-binary>=3.3.5",
    "testcontainers[postgres,redis]>=4.14.2",
]

[tool.ruff]
line-length = 120
target-version = 'py313'
exclude = ["README.md", ".python-version", "LICENSE", "app/models/"]

[tool.ruff.lint]
select = [
    "I",     # isort
    "F",     # pyflakes
    "FAST",  # FastApi
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "COM",   # flake8-commas
    "T10",   # flake8-debugger
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "PLC0415", # import-outside-top-level (backend/AGENTS.md: all imports at module level)
]
ignore = [
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ANN204", # missing-return-type-special-method
    "ANN401", # any-type
    "RET503", # implicit-return
    "COM812", # trailing-comma (conflicts with ruff format)
]
[tool.ruff.lint.per-file-ignores]
"app/api/routes/v*/*.py" = ["ANN201"] # missing-type-annotation
"app/schemas/providers/garmin/*.py" = ["N815"]  # mixedCase from external API
"app/schemas/providers/suunto/*.py" = ["N815"]  # mixedCase from external API
# FORK: upstream files that already imported inside functions when PLC0415 was enabled.
"app/config.py" = ["PLC0415"]
"app/constants/sdk_providers.py" = ["PLC0415"]
"app/integrations/celery/tasks/garmin/backfill_timeout.py" = ["PLC0415"]
"app/integrations/celery/tasks/garmin/backfill_trigger.py" = ["PLC0415"]
"app/services/dashboard_stats_cache.py" = ["PLC0415"]
"app/services/outgoing_webhooks/events.py" = ["PLC0415"]
"app/services/providers/garmin/backfill_state/core.py" = ["PLC0415"]
"app/services/providers/templates/base_oauth.py" = ["PLC0415"]
"app/services/providers/withings/oauth.py" = ["PLC0415"]
"app/services/sync_status_service.py" = ["PLC0415"]
"app/utils/auth.py" = ["PLC0415"]
"app/utils/cursors.py" = ["PLC0415"]
"tests/api/v1/test_auth.py" = ["PLC0415"]
"tests/api/v1/test_outgoing_webhooks.py" = ["PLC0415"]
"tests/api/v1/test_summaries.py" = ["PLC0415"]
"tests/api/v1/test_sync_data.py" = ["PLC0415"]
"tests/api/v1/test_token.py" = ["PLC0415"]
"tests/api/v1/test_users.py" = ["PLC0415"]
"tests/api/v1/test_vendor_workouts.py" = ["PLC0415"]
"tests/api/v1/test_workouts.py" = ["PLC0415"]
"tests/integrations/test_polar_import.py" = ["PLC0415"]
"tests/integrations/test_provider_oauth.py" = ["PLC0415"]
"tests/providers/apple/test_apple_handlers.py" = ["PLC0415"]
"tests/providers/polar/test_polar_oauth.py" = ["PLC0415"]
"tests/providers/polar/test_polar_workouts.py" = ["PLC0415"]
"tests/providers/suunto/test_suunto_oauth.py" = ["PLC0415"]
"tests/providers/ultrahuman/test_ultrahuman_data_247.py" = ["PLC0415"]
"tests/providers/ultrahuman/test_ultrahuman_oauth.py" = ["PLC0415"]
"tests/providers/withings/test_withings_webhooks.py" = ["PLC0415"]
"tests/repositories/test_application_repository.py" = ["PLC0415"]
"tests/repositories/test_data_point_series_repository.py" = ["PLC0415"]
"tests/repositories/test_developer_repository.py" = ["PLC0415"]
"tests/repositories/test_event_record_repository.py" = ["PLC0415"]
"tests/repositories/test_user_connection_repository.py" = ["PLC0415"]
"tests/services/test_developer_service.py" = ["PLC0415"]
"tests/services/test_event_record_service.py" = ["PLC0415"]
"tests/services/test_provider_settings_service.py" = ["PLC0415"]
"tests/services/test_svix_pseudonyms.py" = ["PLC0415"]
"tests/services/test_system_info_service.py" = ["PLC0415"]
"tests/services/test_user_service.py" = ["PLC0415"]
"tests/tasks/sdk_upload_kill_worker.py" = ["PLC0415"]
"tests/tasks/test_garmin_webhook_task.py" = ["PLC0415"]
"tests/tasks/test_process_sdk_upload_task.py" = ["PLC0415"]
"tests/utils_tests/test_conversion.py" = ["PLC0415"]
"tests/utils_tests/test_security.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-third-party = ["celery"]

[tool.ty.src]
exclude = ["migrations/", "app/models/", "tests/", "README.md", ".python-version", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v --tb=short"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"
